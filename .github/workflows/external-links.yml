name: Audit external links

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Purge unused CSS
        run: npm run purge:css
      - name: Audit external links with retries
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: false
          failIfEmpty: true
          format: markdown
          jobSummary: true
          output: lychee/external-links.md
          args: --root-dir ./_site --max-retries 3 --retry-wait-time 2 --timeout 20 --accept '200..=299,403,429' --exclude-all-private --verbose --no-progress '_site/**/*.html'
      - name: Explain transient-response policy
        if: always()
        run: |
          {
            echo '### External-link interpretation'
            echo '- Confirmed non-transient failures remain visible in the Lychee report.'
            echo '- HTTP 403 and 429 are treated as anti-bot or rate-limit responses, not confirmed dead links.'
            echo '- Timeouts remain visible for follow-up but do not block site deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload external-link report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: external-link-report
          path: lychee/external-links.md
          if-no-files-found: warn
