name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

permissions:
  contents: read

jobs:
  check-links-on-site:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Purge unused CSS
        run: npm run purge:css
      - name: Check strict internal links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          args: --offline --root-dir ./_site --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
